[project]
name = "mcp-rag"
version = "0.1.0"
description = "MCP server for RAG retrieval and ETL (parallel to backend embed stack)"
requires-python = ">=3.13"
dependencies = [
    "aiosqlite>=0.22.1",
    "faiss-cpu>=1.14.3",
    "fastmcp>=2.14.0",
    "httpx>=0.28.1",
    "numpy>=2.2.0",
    "pydantic>=2.12.0",
    "pydantic-settings>=2.14.0",
    "sqlalchemy[asyncio]>=2.0.51",
    "sqlmodel>=0.0.39",
    "structlog>=24.4.0",
]

[dependency-groups]
dev = [
    "pytest>=8.4.0",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.15.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.uv]
default-groups = ["dev"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "unit: business-logic unit tests (tests/unit/)",
]

[tool.ruff]
line-length = 120
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "B", "UP"]
